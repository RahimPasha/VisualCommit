name: CI

# Builds and runs the default tests on Windows, macOS and Linux. The default tests include the
# scripted visual walk-through; its screenshots are uploaded so each platform's rendering can be
# looked at. The real-window pass is Windows-only, takes over the mouse and never runs here.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show tool versions
        run: |
          dotnet --version
          git --version

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-${{ matrix.os }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14
