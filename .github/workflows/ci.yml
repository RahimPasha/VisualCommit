name: CI

# Builds and runs the default tests on Windows, macOS and Linux, and twice more in a bare Ubuntu
# container that the repo's own set-up script prepares. The default tests include the scripted
# visual walk-through; its screenshots are uploaded so each platform's rendering can be looked
# at. The real-window pass is Windows-only, takes over the mouse and never runs here; nor does the
# live command against real GitHub (D250, D337), which needs the owner's token.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show tool versions
        run: |
          dotnet --version
          git --version

      - name: Build
        id: build
        run: dotnet build --configuration Release

      # The step has a time limit of its own, so that a hang cannot use up the job's whole time.
      # Phase 3 added about 900 tests (the default run took 3.5 minutes on CI before it, 7 to 8 after
      # it); phase 4 a fifth test process, and Windows passed 12 of the old 14 minutes (D152);
      # phase 5 two more and the undo history's reads in every operation, and Windows reached
      # the 24-minute limit (run 38853641791, D184); phase 6 two more walk-through projects, and
      # macOS passed 32 of the 40 minutes (run 39943973579, D232).
      - name: Test
        timeout-minutes: 55
        run: dotnet test --configuration Release --no-build

      # The keychain's own tests (D259, D270): each runs the platform's real store against an entry
      # of its own that it deletes. They run also after a failed Test, so that one failing test does
      # not hide the keychain's result. Windows' step leaves the job if the runner refuses the
      # Credential Manager with error 1312 (D333).
      - name: Keychain (Windows Credential Manager)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 5
        env:
          VISUALCOMMIT_KEYCHAIN_TESTS: windows
        run: dotnet test --project tests/VisualCommit.Hosting.Tests --configuration Release --no-build --filter-class "*WindowsTokenStoreRealTests"

      - name: Keychain (macOS keychain)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 5
        env:
          VISUALCOMMIT_KEYCHAIN_TESTS: macos
        run: dotnet test --project tests/VisualCommit.Hosting.Tests --configuration Release --no-build --filter-class "*MacKeychainTokenStoreRealTests"

      # The real-window pass and the live command against real GitHub are outside the solution,
      # and neither runs here (D337): the pass takes over the mouse, the live command acts on the
      # owner's account with a token CI never has. Building them keeps them from going stale
      # unnoticed. It runs also after a failed Test or keychain step, as the keychain steps do, so
      # that one failing test does not hide a compile break here. Bash, which GitHub runs with -e,
      # so that a failure of the first build fails the step (PowerShell's step would go by the last
      # command's exit code alone).
      - name: Build the opt-in projects
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        shell: bash
        run: |
          dotnet build tests/VisualCommit.RealWindowTests --configuration Release
          dotnet build tests/VisualCommit.LiveHostingTests --configuration Release

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-${{ matrix.os }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14

  # A bare Ubuntu container, set up only by the repo's own script, once for each way the script
  # has of getting the .NET SDK. A Claude Code cloud session starts from Ubuntu 24.04 as root
  # without a .NET SDK; this container has even less software. What these jobs prove: the
  # script installs everything the build and the tests need, and the code builds and passes
  # with the SDK that Ubuntu's package servers carry. What they cannot prove: that the downloads
  # get through a cloud session's network allowlist, because a runner's network is open.
  # docs/cloud-sessions.md lists that as not tried.
  bare-linux-container:
    name: bare ubuntu container, SDK from ${{ matrix.sdk.from }}
    runs-on: ubuntu-latest
    # IPC_LOCK: Ubuntu's gnome-keyring package gives its daemon that file capability when setcap is
    # installed, and a container without it in its bounding set cannot start the daemon at all.
    container:
      image: ubuntu:24.04
      options: --cap-add=IPC_LOCK
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - from: ubuntu packages
            source: ''
            id: ubuntu-packages
          - from: microsoft installer
            source: installer
            id: microsoft-installer

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      SETUP_LINUX_SDK_SOURCE: ${{ matrix.sdk.source }}

    steps:
      # The container has no git yet, so this downloads the files without a .git folder.
      # Nothing in the build or the tests needs the repo's own history.
      - uses: actions/checkout@v7

      - name: Set up the container with the repo's script
        run: bash scripts/setup-linux.sh

      # A second run has to find everything in place and change nothing. The script says what
      # it does, so the step fails if the second run refreshed, installed or generated anything.
      - name: Run the script again
        run: |
          bash scripts/setup-linux.sh > /tmp/second-run.txt 2>&1 || { cat /tmp/second-run.txt; exit 1; }
          cat /tmp/second-run.txt
          if grep -E 'setup-linux: (refreshing|installing|generating)' /tmp/second-run.txt; then
            echo "The second run did again what the first run had done."
            exit 1
          fi

      - name: Show tool versions
        run: |
          dotnet --version
          git --version

      - name: Build
        id: build
        run: dotnet build --configuration Release

      - name: Test
        timeout-minutes: 14
        run: dotnet test --configuration Release --no-build

      # The Secret Service store's own tests under a private session bus, with a keyring that lives
      # only in this step's temporary folder (D259, D270).
      - name: Keychain (Secret Service)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          VISUALCOMMIT_KEYCHAIN_TESTS: secret-service
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"; mkdir -p -m 700 "$XDG_DATA_HOME/keyrings"
          dbus-run-session -- sh -c 'echo "throwaway-$GITHUB_RUN_ID" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && dotnet test --project tests/VisualCommit.Hosting.Tests --configuration Release --no-build --filter-class "*SecretServiceTokenStoreRealTests"'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-bare-ubuntu-container-${{ matrix.sdk.id }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14
